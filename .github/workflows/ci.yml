name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with dev + jax extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,jax]"

      - name: Lint (ruff)
        run: ruff check src/ experiments/ tests/ scripts/

      - name: Tests (pytest)
        run: pytest
