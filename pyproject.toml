[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-md"
version = "0.1.0"
description = "Molecular-dynamics-inspired engine for simulating organism behavior as coupled response units."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David J. Cox", email = "cox.david.j@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "gymnasium>=0.29",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]
# pygame is only needed for the live "human" render; it lacks a prebuilt wheel
# on some new Python versions, so it is kept optional.
render = ["pygame>=2.5"]
# JAX-vectorized engine (batched population dynamics + autodiff for fitting).
jax = ["jax[cpu]>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
